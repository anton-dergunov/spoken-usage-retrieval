[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spoken-usage-retrieval"
version = "0.1.0"
description = "A prototype for retrieving real Spanish usage from timestamped YouTube captions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

